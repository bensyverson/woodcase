<div class="v-theme">
  <form class="v-theme-axis" method="get" action="/files/a1b2c3d4e5f6">
    <label class="v-theme-label" for="v-theme-Base">Base:</label>
    <select id="v-theme-Base" class="v-theme-select" name="theme" data-axis="Base">
      <option value="" selected>default</option>
      <option value="Base:Slate">Slate</option>
      <option value="Base:Sand">Sand</option>
    </select>
    <button class="v-go" type="submit">apply</button>
  </form>
  <form class="v-theme-axis" method="get" action="/files/a1b2c3d4e5f6">
    <label class="v-theme-label" for="v-theme-Mode">Mode:</label>
    <select id="v-theme-Mode" class="v-theme-select" name="theme" data-axis="Mode">
      <option value="" selected>default</option>
      <option value="Mode:Light">Light</option>
      <option value="Mode:Dark">Dark</option>
    </select>
    <button class="v-go" type="submit">apply</button>
  </form>
</div>
