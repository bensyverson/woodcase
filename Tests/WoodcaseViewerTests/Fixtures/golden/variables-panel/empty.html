<section class="v-panel v-variables" id="v-variables">
  <header class="v-panel-head">
    <div class="v-panel-head-title">
      <button class="v-variables-toggle" type="button" title="Collapse or expand the variables list">
        <span class="v-disclosure-glyph" aria-hidden="true">
        <svg viewBox="0 0 10 10">
          <polygon points="1,3 9,3 5,8" fill="currentColor" />
        </svg>
        </span>
      </button>
      <h2 class="v-panel-title">Variables</h2>
    </div>
    <span class="v-panel-note"></span>
  </header>
  <p class="v-empty-note">This file defines no variables.</p>
</section>
